services:
  guntacontrol:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Config (guntacontrol.yaml), SQLite history + audit all live here (persistent).
      # Copy guntacontrol.example.yaml to ./data/guntacontrol.yaml and set the boiler
      # host + writeKey there; the UI rewrites it when you toggle the Schreibschutz.
      - ./data:/data
    environment:
      # Boiler clock / timestamps are local time.
      TZ: Europe/Vienna
      # Optional: a write key here is used only if writeKey is left empty in the YAML.
      # GUNTAMATIC_WRITE_KEY: ${GUNTAMATIC_WRITE_KEY}
